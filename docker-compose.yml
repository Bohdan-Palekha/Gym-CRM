# Gym CRM — full local stack.
#
#   docker compose up -d --build --wait     build images, start everything, wait until healthy
#   ./scripts/smoke-test.sh                 verify the whole chain end to end
#   docker compose down [-v]                stop (and with -v also wipe MySQL/Mongo/ActiveMQ data)
#
#   discovery-server ── Eureka registry (both apps register here)
#   gym-crm ─────────── REST + JWT, MySQL for persistence, publishes training events to ActiveMQ
#   trainer-workload ── consumes those events, keeps monthly workload summaries in MongoDB
#   mysql-db / mongo-db / activemq ── infrastructure
#
# Every setting written in the `:-` default form below can be overridden through a .env file (see .env.example).
# The defaults are demo values for local use only.

name: gym-crm

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Settings shared by the three Spring Boot services
x-java-service: &java-service
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *logging

# Environment shared by gym-crm and trainer-workload-service
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: "${APP_PROFILE:-dev}"
  SERVER_SHUTDOWN: graceful
  EUREKA_URL: http://discovery-server:8761/eureka/
  # must be identical in both services (gym-crm signs, trainer-workload-service verifies)
  INTERNAL_JWT_SECRET: "${INTERNAL_JWT_SECRET:-demo-shared-inter-service-secret-CHANGE-ME-0123456789}"
  ACTIVEMQ_BROKER_URL: tcp://activemq:61616
  ACTIVEMQ_USER: "${ACTIVEMQ_USER:-admin}"
  ACTIVEMQ_PASSWORD: "${ACTIVEMQ_PASSWORD:-admin}"

services:
  discovery-server:
    <<: *java-service
    image: "${IMAGE_PREFIX:-gymcrm}/discovery-server:${IMAGE_TAG:-dev}"
    build:
      context: .
      args:
        MODULE: discovery-server
        PORT: "8761"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DISCOVERY_SERVER_PORT:-8761}:8761"

  gym-crm:
    <<: *java-service
    image: "${IMAGE_PREFIX:-gymcrm}/gym-crm:${IMAGE_TAG:-dev}"
    build:
      context: .
      args:
        MODULE: gym-crm
        PORT: "8080"
    environment:
      <<: *app-env
      # `dev` profile reads these; hbm2ddl=update creates the schema on first start
      DB_URL: "jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:-gymcrm_dev}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      DB_USERNAME: "${MYSQL_USER:-gymcrm_dev}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-gymcrm_dev}"
      JWT_SECRET: "${JWT_SECRET:-dev-environment-only-jwt-signing-secret-do-not-reuse-0123456789}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GYM_CRM_PORT:-8080}:8080"
    depends_on:
      discovery-server: { condition: service_healthy }
      mysql-db: { condition: service_healthy }
      activemq: { condition: service_healthy }

  trainer-workload-service:
    <<: *java-service
    image: "${IMAGE_PREFIX:-gymcrm}/trainer-workload-service:${IMAGE_TAG:-dev}"
    build:
      context: .
      args:
        MODULE: trainer-workload-service
        PORT: "8082"
    environment:
      <<: *app-env
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-mongo-root-pass}@mongo-db:27017/trainer_workload?authSource=admin"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${TRAINER_WORKLOAD_PORT:-8082}:8082"
    depends_on:
      discovery-server: { condition: service_healthy }
      mongo-db: { condition: service_healthy }
      activemq: { condition: service_healthy }

  mongo-db:
    image: mongo:7.0
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-mongo-root-pass}"
    volumes:
      - mongo-data:/data/db
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    healthcheck:
      # authenticated on purpose: during first start the entrypoint runs a temporary unauthenticated
      # mongod, and this only succeeds once the root user exists
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval "db.adminCommand('ping')" > /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mysql-db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-mysql-root-pass}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-gymcrm_dev}"
      MYSQL_USER: "${MYSQL_USER:-gymcrm_dev}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-gymcrm_dev}"
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temporary init server runs with networking disabled, so this
      # only passes once the real server is up
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  activemq:
    image: "${ACTIVEMQ_IMAGE:-apache/activemq-classic:6.2.0}"
    restart: unless-stopped
    logging: *logging
    environment:
      # broker login (what both services send) and web console login, same credentials for both
      ACTIVEMQ_CONNECTION_USER: "${ACTIVEMQ_USER:-admin}"
      ACTIVEMQ_CONNECTION_PASSWORD: "${ACTIVEMQ_PASSWORD:-admin}"
      ACTIVEMQ_WEB_USER: "${ACTIVEMQ_USER:-admin}"
      ACTIVEMQ_WEB_PASSWORD: "${ACTIVEMQ_PASSWORD:-admin}"
    volumes:
      - activemq-data:/opt/apache-activemq/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ACTIVEMQ_BROKER_PORT:-61616}:61616"
      - "${BIND_ADDRESS:-127.0.0.1}:${ACTIVEMQ_CONSOLE_PORT:-8161}:8161"
    healthcheck:
      # plain TCP check on the web console: Jetty starts after the broker in the same Spring context,
      # and unlike probing 61616 it does not make the broker log a failed OpenWire handshake each time
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8161'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
  mysql-data:
  activemq-data:
