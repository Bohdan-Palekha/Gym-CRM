spring.application.name=trainer-workload-service
server.port=${SERVER_PORT:8082}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#must be identical to gym-crm's security.jwt.inter-service.secret
# override via INTERNAL_JWT_SECRET: INTERNAL_JWT_SECRET=demo-shared-inter-service-secret-CHANGE-ME-0123456789
security.jwt.inter-service.secret=${INTERNAL_JWT_SECRET:demo-shared-inter-service-secret-CHANGE-ME-0123456789}

#queue gym-crm publishes workload changes, must be identical
trainer-workload.jms.destination.workload-updates=trainer-workload.updates
#dead letter queue for failed messages
trainer-workload.jms.destination.workload-updates-dlq=trainer-workload.updates.dlq

#broker side redelivery for failures like unexpected runtime exception
#exhausted retries fall through to ActiveMQ.DLQ, no broker XML
trainer-workload.jms.redelivery.max-redeliveries=3
trainer-workload.jms.redelivery.initial-delay-ms=1000
trainer-workload.jms.redelivery.max-delay-ms=30000
trainer-workload.jms.redelivery.backoff-multiplier=2.0

#retries for concurrent JMS consumers updating the same trainer/month in TrainerWorkloadServiceImpl
trainer-workload.mongo.max-save-attempts=5
#firstName+lastName index declared on TrainerWorkloadDocument on startup
#not suitable for large production
spring.data.mongodb.auto-index-creation=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

#bodies over ~2KB are truncated in log lines,
spring.jackson.default-property-inclusion=non_null

logging.level.com.gymcrm=DEBUG
logging.level.org.springframework=INFO
