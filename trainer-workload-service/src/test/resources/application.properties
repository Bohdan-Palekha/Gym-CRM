spring.application.name=trainer-workload-service

eureka.client.enabled=false

security.jwt.inter-service.secret=test-only-internal-service-jwt-signing-secret-0123456789

management.endpoints.web.exposure.include=health,info

#self-contained embedded broker, no external ActiveMQ
#${random.uuid} in the broker name
#vm:// broker instances are looked up by name and shared jvm wide, fixed name makes every
#full spring context in the same test run each with its own @JmsListener bean
#thus connect to the same physical broker and competes for the same messages.
spring.activemq.broker-url=vm://trainer-workload-test-broker-${random.uuid}?broker.persistent=false&broker.useJmx=false
trainer-workload.jms.destination.workload-updates=trainer-workload.updates.test
trainer-workload.jms.destination.workload-updates-dlq=trainer-workload.updates.dlq.test
#redeliver fast in tests
trainer-workload.jms.redelivery.max-redeliveries=1
trainer-workload.jms.redelivery.initial-delay-ms=50
trainer-workload.jms.redelivery.max-delay-ms=50
trainer-workload.jms.redelivery.backoff-multiplier=1.0
