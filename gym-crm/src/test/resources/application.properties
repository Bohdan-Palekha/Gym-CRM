spring.application.name=Gym Application Test

#datasource
spring.datasource.url=jdbc:h2:mem:gymcrm_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

#hibernate
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=create-drop
hibernate.show_sql=false
hibernate.format_sql=false

security.jwt.secret=test-only-jwt-signing-secret-not-for-production-use-0123456789
security.jwt.expiration-ms=3600000
security.brute-force.max-attempts=3
security.brute-force.lockout-duration-minutes=5
security.cors.allowed-origins=*

#SecurityIntegrationTest, ActuatorIntegrationTest run the real GymApplication with spring cloud autoconfiguration active
#so eureka registration is disabled
eureka.client.enabled=false

security.jwt.inter-service.secret=test-only-internal-service-jwt-signing-secret-0123456789
security.jwt.inter-service.expiration-ms=300000

#self-contained embedded broker, no external ActiveMQ needed
spring.activemq.broker-url=vm://gym-crm-test-broker?broker.persistent=false&broker.useJmx=false
trainer-workload.jms.destination.workload-updates=trainer-workload.updates.test
