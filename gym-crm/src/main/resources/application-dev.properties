spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gymcrm_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:gymcrm_dev}
spring.datasource.password=${DB_PASSWORD:gymcrm_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=true
hibernate.format_sql=true

logging.level.com.gymcrm=DEBUG

security.jwt.secret=${JWT_SECRET:dev-environment-only-jwt-signing-secret-do-not-reuse-0123456789}

#docker run -p 61616:61616 apache/activemq-classic
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}