spring.application.name=Gym Application

#per task default environment when none is specified externally
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.environment=${spring.profiles.active}

info.app.name=${spring.application.name}
info.app.description=Gym CRM REST API - trainee/trainer/training management
#env contributor for actuator info endpoint, disabled by default by spring, without it returns empty json
management.info.env.enabled=true

security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

security.brute-force.max-attempts=3
security.brute-force.lockout-duration-minutes=5

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://example.com}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.appname=gym-crm-service
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#used to mint the "who is calling" claim in InterServiceTokenProvider, no longer used for eureka lookup
trainer-workload.service-id=trainer-workload-service

#must match the value from workload service
security.jwt.inter-service.secret=${INTERNAL_JWT_SECRET:demo-shared-inter-service-secret-CHANGE-ME-0123456789}
security.jwt.inter-service.expiration-ms=${INTERNAL_JWT_EXPIRATION_MS:300000}
security.jwt.inter-service.caller-id=gym-crm-service

#queue trainer-workload-service consumes, must be identical on both sides
#broker connection is different for environments
trainer-workload.jms.destination.workload-updates=trainer-workload.updates
